# LIF-625 — manual promotion of migrations to LIFTY Production.
#
# Applies the same supabase/migrations/ files that staging already ran, to the
# production project. Runs only on explicit dispatch, from main only.
# The LIFTY Production project does not exist yet; until the
# SUPABASE_PROD_DB_URL secret is set, this workflow fails fast with a clear
# message instead of doing anything.
name: supabase-prod

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "promote" to apply migrations to LIFTY Production'
        required: true

concurrency:
  group: supabase-prod
  cancel-in-progress: false

jobs:
  push-migrations:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Check confirmation
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "promote" ]; then
            echo 'Confirmation input must be exactly "promote".' >&2
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Push migrations to LIFTY Production
        run: |
          if [ -z "$SUPABASE_PROD_DB_URL" ]; then
            echo 'SUPABASE_PROD_DB_URL secret is not set: LIFTY Production does not exist yet (LIF-625).' >&2
            exit 1
          fi
          supabase db push --yes --db-url "$SUPABASE_PROD_DB_URL"
        env:
          SUPABASE_PROD_DB_URL: ${{ secrets.SUPABASE_PROD_DB_URL }}
