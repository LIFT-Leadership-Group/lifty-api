# Verify pull requests with the same `npm run verify` the Deploy workflow runs
# after merge. Context drafts promoted from the ops dashboard open pull
# requests here (LIF-1298); a context change that breaks the next_step size
# limits or the installed-client contract fails before merge, not at deploy.

name: Verify

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (typecheck + tests + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify
        run: npm run verify
