# LIF-625 — LIFTY Staging follows main automatically.
#
# Merging a migration into main applies it to the LIFTY Staging Supabase
# project (siafcvcdhenahviuoxer). Promotion to production is a separate,
# manual dispatch (supabase-prod.yml) of the exact same files; there is no
# staging branch anywhere in this flow.
name: supabase-staging

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"

concurrency:
  group: supabase-staging
  cancel-in-progress: false

jobs:
  push-migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Push migrations to LIFTY Staging
        run: supabase db push --yes --db-url "$SUPABASE_STAGING_DB_URL"
        env:
          # Session-pooler URI incl. password:
          # postgresql://postgres.siafcvcdhenahviuoxer:<pw>@aws-0-us-west-1.pooler.supabase.com:5432/postgres
          SUPABASE_STAGING_DB_URL: ${{ secrets.SUPABASE_STAGING_DB_URL }}
